[alembic]
script_location = alembic
prepend_sys_path = src
version_path_separator = os
# The URL is taken from the environment (see alembic/env.py): alembic.ini must
# not become a second source of truth for DB_PATH. Keep this file ASCII-only,
# because alembic reads it in the host locale encoding.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
