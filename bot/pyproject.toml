[project]
name = "ruprobe-bot"
version = "0.1.0"
description = "RuProbe — Telegram-бот проверки доступности IP, доменов и диапазонов"
requires-python = ">=3.10,<3.15"
dependencies = [
    # aiogram 3.31.0 — Bot API 10.3. «aiogram 10.3» не существует: 10.3 — это
    # версия Bot API, а не библиотеки. См. docs/stack.md, раздел 2.1.
    "aiogram==3.31.0",
    "sqlalchemy[asyncio]==2.0.44",
    "aiosqlite==0.21.0",
    "alembic==1.16.5",
    "pydantic-settings==2.11.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
